[plugin]
prepend_previewers = [
  { url = "*.md", run = "mdv-previewer" },
  { url = "*.markdown", run = "mdv-previewer" },
  { url = "*.txt", run = "mdv-previewer" },
  { url = "*.mmd", run = "mermaid" },
  { url = "*.mermaid", run = "mermaid" },
]

prepend_preloaders = [
  { url = "*.md", run = "mdv-previewer" },
  { url = "*.markdown", run = "mdv-previewer" },
  { url = "*.txt", run = "mdv-previewer" },
]
